[package]
name = "ailicili"
version = "1.0.0-beta.1"
description = "Windows Bilibili video and multiplatform live viewing application"
homepage = "https://github.com/NeserCode-Studio/ailicili"
authors = ["nesercode"]
edition = "2021"

[lib]
name = "ailicili_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.5.6", features = [] }

[dependencies]
tauri = { version = "~2.10.3", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-opener = "~2.5.5"
tauri-plugin-http = { version = "~2.5.9", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
flate2 = "1"
tokio = { version = "1", features = ["macros", "time"] }
thiserror = "2"
urlencoding = "2"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
env_logger = "0.11"
log = "0.4"
md-5 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
webview2-com = "0.38.2"
windows-core = "0.61.2"
