[package]
name = "app-template"
version = "0.1.0"
description = "A Tauri App"
authors = ["nesercode"]
edition = "2021"

[lib]
name = "app_template_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.5.6", features = [] }

[dependencies]
tauri = { version = "~2.10.3", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-opener = "~2.5.5"
tauri-plugin-shell = "~2.3.6"
tauri-plugin-http = "~2.5.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
tokio = { version = "1", features = ["macros"] }
thiserror = "2"
urlencoding = "2"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
env_logger = "0.11"
log = "0.4"
md-5 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
